[package]
name = "hex-traders-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Deterministic Rust engine for Hex Traders base-game rules"
repository = "https://github.com/strange0g/hex-traders"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["board-game", "game-engine", "deterministic", "hex-grid", "rules"]
categories = ["games", "game-engines"]
include = [
    "/src/**",
    "/tests/**",
    "/benches/**",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/docs/releases/*.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/Cargo.lock",
    "/rust-toolchain.toml",
    "/deny.toml",
]

[dependencies]
rand = { version = "=0.10.3", default-features = false, features = ["unbiased"] }
rand_chacha = { version = "=0.10.0", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[dev-dependencies]
proptest = "=1.12.0"
criterion = "=0.8.2"

[[bench]]
name = "engine"
harness = false
