[package]
name = "hex-traders-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"

[dependencies]
rand = { version = "=0.10.3", default-features = false, features = ["unbiased"] }
rand_chacha = { version = "=0.10.0", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[dev-dependencies]
proptest = "=1.12.0"
criterion = "=0.8.2"

[[bench]]
name = "engine"
harness = false
